[platformio]
default_envs = esp32-poe-iso

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@6.21.5
extra_scripts = pre:scripts/embed_web.py
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
; Scan conditional library includes without LDF preprocessor emulation.
lib_ldf_mode = chain

[env:esp32-poe-iso]
board = esp32-poe-iso
build_flags = ${env.build_flags} -DDATV_BOARD_POE_ISO=1

[env:esp32dev_wifi]
board = esp32dev
build_flags = ${env.build_flags} -DDATV_BOARD_WIFI=1
