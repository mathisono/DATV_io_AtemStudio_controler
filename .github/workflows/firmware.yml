name: Firmware and control tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Test arbitration and ATEM session behavior
        run: python scripts/test_native.py
      - name: Install dashboard test dependencies
        run: npm ci --ignore-scripts
      - name: Test dashboard requests and feedback
        run: npm test

  firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        environment: [esp32-poe-iso, esp32dev_wifi]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned build tool
        run: python -m pip install platformio==6.1.18
      - name: Compile firmware and embedded web assets
        run: pio run -e ${{ matrix.environment }}
